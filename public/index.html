<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GroundedMind — Prototype</title>
  
  <!-- Tailwind CSS: A utility-first CSS framework imported via CDN for quick styling -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4 sm:p-8 font-sans">

  <!-- Main Container: Limits the max width so the layout stays centered and neat -->
  <main class="max-w-2xl w-full flex flex-col gap-6">

    <!-- ================================================================= -->
    <!-- HEADER SECTION                                                    -->
    <!-- ================================================================= -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-emerald-400">GroundedMind</h1>
        <p class="text-xs text-slate-400">Interactive Sensory Grounding & Generative AI Hub</p>
      </div>
      
      <!-- Web Audio API toggle button to turn procedural ambient noise ON/OFF -->
      <button id="audioToggleBtn" onclick="toggleSoundscape()" 
        class="flex items-center gap-2 bg-slate-900 border border-slate-700 hover:border-emerald-500 px-3 py-1.5 rounded-full text-xs font-medium transition">
        <span id="audioIndicator" class="w-2 h-2 rounded-full bg-slate-500"></span>
        <span id="audioLabel">Ambient Noise: OFF</span>
      </button>
    </header>

    <!-- ================================================================= -->
    <!-- MULTIMEDIA MODULE 1: HTML5 CANVAS BREATHING VISUALIZER            -->
    <!-- ================================================================= -->
    <section class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 flex flex-col items-center">
      <div class="flex justify-between w-full text-xs text-slate-400 mb-2 px-2">
        <span class="font-medium text-emerald-400 uppercase tracking-wider">Canvas Breathing Guide</span>
        <span id="breathPhaseText" class="tracking-widest uppercase">Inhale...</span>
      </div>
      <!-- The HTML5 Canvas element: A digital whiteboard where JavaScript draws graphics -->
      <canvas id="breathCanvas" width="300" height="200" class="w-full max-w-[300px] h-[200px]"></canvas>
    </section>

    <!-- ================================================================= -->
    <!-- SMART AI QUICK-ACTION BUTTONS                                     -->
    <!-- ================================================================= -->
    <section>
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Smart AI Quick-Action Menus</h2>
        <span class="text-[11px] text-emerald-400/80">One-click grounding</span>
      </div>

      <!-- Grid layout with 3 one-click grounding presets -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
        <!-- Button 1: 5-4-3-2-1 Sensory Grounding Technique -->
        <button onclick="triggerQuickAction('Guide me through an immediate 5-4-3-2-1 sensory grounding exercise right now.')"
          class="bg-slate-900 border border-slate-800 hover:border-emerald-500 hover:bg-slate-800 p-3 rounded-xl text-left transition group">
          <p class="text-xs font-semibold text-slate-200 group-hover:text-emerald-400">⚡ 5-4-3-2-1 Reset</p>
          <p class="text-[11px] text-slate-500 mt-0.5">Physical sensory focus</p>
        </button>

        <!-- Button 2: Guided Imagery / Mental Relaxation -->
        <button onclick="triggerQuickAction('Give me a brief, calming 2-minute visualization of walking through a quiet, damp pine forest in the rain.')"
          class="bg-slate-900 border border-slate-800 hover:border-emerald-500 hover:bg-slate-800 p-3 rounded-xl text-left transition group">
          <p class="text-xs font-semibold text-slate-200 group-hover:text-emerald-400">🌲 Visual Calm</p>
          <p class="text-[11px] text-slate-500 mt-0.5">Guided mental scenery</p>
        </button>

        <!-- Button 3: Cognitive Reframing for Exam/Deadline Stress -->
        <button onclick="triggerQuickAction('I am overwhelmed by university deadlines and terrified of failing. Help me reframe this thought calmly and constructively.')"
          class="bg-slate-900 border border-slate-800 hover:border-emerald-500 hover:bg-slate-800 p-3 rounded-xl text-left transition group">
          <p class="text-xs font-semibold text-slate-200 group-hover:text-emerald-400">🧠 Reframe Anxiety</p>
          <p class="text-[11px] text-slate-500 mt-0.5">CBT perspective shift</p>
        </button>
      </div>
    </section>

    <!-- ================================================================= -->
    <!-- MULTIMEDIA MODULE 2: GENERATIVE AI INTERFACE                      -->
    <!-- ================================================================= -->
    <section class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex flex-col gap-3">
      <!-- Chat Display Box: Where the AI guidance text appears -->
      <div id="chatBox" class="min-h-[140px] max-h-56 overflow-y-auto text-sm leading-relaxed text-slate-300 space-y-3 pr-2">
        <p class="text-slate-500 italic">Select a Smart Action above or type what's on your mind below...</p>
      </div>

      <!-- User Input and Send Button -->
      <div class="flex gap-2 pt-2 border-t border-slate-800/80">
        <input id="promptInput" type="text" placeholder="Tell me what you're feeling right now..." 
          class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-emerald-400 transition"
          onkeydown="if(event.key === 'Enter') handleUserInput()">
        
        <button id="sendBtn" onclick="handleUserInput()" 
          class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-5 py-2 rounded-xl text-sm font-semibold transition flex items-center justify-center min-w-[70px]">
          Send
        </button>
      </div>
    </section>
  </main>

  <!-- ================================================================= -->
  <!-- JAVASCRIPT LOGIC (Runs directly inside the user's browser)        -->
  <!-- ================================================================= -->
  <script>
    /* ===============================================================
       1. HTML5 CANVAS BREATHING ANIMATION
       =============================================================== */
    
    // Get the canvas element and its 2D rendering context (our "paintbrush")
    const canvas = document.getElementById('breathCanvas');
    const ctx = canvas.getContext('2d');
    const phaseText = document.getElementById('breathPhaseText');

    // Track the start time to calculate smooth animation cycles
    let startTime = Date.now();
    const cycleDuration = 8000; // An 8-second total breathing cycle (4s Inhale, 4s Exhale)

    // Render function that redraws the canvas frame-by-frame (runs ~60 times per second)
    function renderCanvas() {
      // How many milliseconds have passed in the current 8-second cycle
      const elapsed = (Date.now() - startTime) % cycleDuration;
      
      // Progress from 0.0 to 1.0 throughout the cycle
      const progress = elapsed / cycleDuration;
      
      // Math.sin creates a smooth wave moving up and down between 0 and 1
      const oscillation = (Math.sin(progress * Math.PI * 2 - Math.PI / 2) + 1) / 2;

      // Find the center coordinates of our canvas
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      
      // Circle sizing: expands when inhaling, shrinks when exhaling
      const minRadius = 35;
      const maxRadius = 70;
      const currentRadius = minRadius + (maxRadius - minRadius) * oscillation;

      // Update text above the circle to guide user breathing
      phaseText.textContent = oscillation > 0.5 ? 'Inhale slowly...' : 'Exhale gently...';

      // Wipe the canvas clean before drawing the next frame
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- Draw 1: Outer glowing aura ring ---
      ctx.beginPath();
      ctx.arc(centerX, centerY, currentRadius * 1.25, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(16, 185, 129, ${0.08 * oscillation})`;
      ctx.fill();

      // --- Draw 2: Main pulsating breathing circle ---
      ctx.beginPath();
      ctx.arc(centerX, centerY, currentRadius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(16, 185, 129, ${0.25 + 0.25 * oscillation})`;
      ctx.strokeStyle = '#34d399';
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();

      // --- Draw 3: Small anchor center dot ---
      ctx.beginPath();
      ctx.arc(centerX, centerY, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#6ee7b7';
      ctx.fill();

      // requestAnimationFrame tells the browser to call renderCanvas again on the next monitor refresh
      requestAnimationFrame(renderCanvas);
    }

    // Start the animation loop immediately
    renderCanvas();


    /* ===============================================================
       2. PROCEDURAL SOUND SYNTHESIS (Web Audio API)
       =============================================================== */
    
    // AudioContext is the browser's master audio engine
    let audioCtx = null;
    let noiseNode = null;
    let isPlayingAudio = false;

    function toggleSoundscape() {
      // AudioContext must only initialize after a user click (browser security requirement)
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      // If audio is currently playing, stop it
      if (isPlayingAudio) {
        noiseNode.stop();
        isPlayingAudio = false;
        document.getElementById('audioIndicator').className = 'w-2 h-2 rounded-full bg-slate-500';
        document.getElementById('audioLabel').textContent = 'Ambient Noise: OFF';
      } 
      // If audio is off, synthesize brown noise programmatically
      else {
        // Create an audio buffer lasting 2 seconds
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        let lastOut = 0.0;

        // Brownian Noise Algorithm:
        // Generates random numbers and integrates them to produce deep, soothing low-frequency noise (like rain or waves)
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1; // Pure random static
          data[i] = (lastOut + 0.02 * white) / 1.02; // Dampen high pitches
          lastOut = data[i];
          data[i] *= 3.5; // Scale volume
        }

        // Create an audio source node from the generated buffer
        noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = buffer;
        noiseNode.loop = true; // Loop the audio continuously

        // Biquad Low-Pass Filter: Cuts off harsh high frequencies above 400Hz
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400;

        // Gain Node: Controls the overall volume level (set gently to 15%)
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.15;

        // Chain the audio nodes together: Source -> Filter -> Volume -> Speakers
        noiseNode.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        // Start playback
        noiseNode.start();
        isPlayingAudio = true;
        
        // Update the visual indicator badge
        document.getElementById('audioIndicator').className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
        document.getElementById('audioLabel').textContent = 'Ambient Noise: ACTIVE';
      }
    }


    /* ===============================================================
       3. GENERATIVE AI CHAT & SMART BUTTON LOGIC
       =============================================================== */
    
    const chatBox = document.getElementById('chatBox');
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');

    // Sends a prompt string to our local backend server (/api/chat)
    async function submitToAI(text) {
      // 1. Display a loading spinner while the model thinks
      chatBox.innerHTML = `
        <div class="flex items-center gap-2 text-emerald-400 text-sm animate-pulse">
          <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span>GroundedMind is generating guidance...</span>
        </div>`;
      
      // Temporarily disable the Send button to prevent double-clicking
      sendBtn.disabled = true;

      try {
        // Send a POST request to our local server.js
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        
        const data = await response.json();

        // If the backend sent back an error, display it in red
        if (data.error) {
          chatBox.innerHTML = `<div class="text-rose-400 text-xs">Error: ${data.error}</div>`;
        } 
        // If successful, render the AI's reply text inside the chat box
        else {
          chatBox.innerHTML = `
            <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800 text-slate-200 text-xs sm:text-sm whitespace-pre-line leading-relaxed">
              ${data.reply}
            </div>`;
        }
      } catch (err) {
        // Triggered if the backend server is stopped or unreachable
        chatBox.innerHTML = `<div class="text-rose-400 text-xs">Failed to reach local server. Make sure node server.js is running.</div>`;
      } finally {
        // Re-enable the Send button
        sendBtn.disabled = false;
      }
    }

    // Helper function called by the Smart Action buttons
    function triggerQuickAction(actionPrompt) {
      submitToAI(actionPrompt);
    }

    // Reads user text from the input box and submits it
    function handleUserInput() {
      const text = promptInput.value.trim();
      if (!text) return; // Do nothing if the input is empty
      promptInput.value = ''; // Clear input field
      submitToAI(text);
    }
  </script>
</body>
</html>
